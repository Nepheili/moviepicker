<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск фильмов — MoviePicker</title>
  <meta name="description" content="Поиск фильмов по названию и описанию.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script>
    try { var t = localStorage.getItem("moviepicker-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="js/data-loader.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/search.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="MoviePicker — на главную">
        <span class="logo-mark" aria-hidden="true">🎬</span>
        <span>Movie<span class="accent">Picker</span></span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Основная навигация">
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="index.html#genres">Жанры</a></li>
          <li><a href="search.html" aria-current="page">Поиск</a></li>
          <li><a href="about.html">О проекте</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-button" data-theme-toggle aria-label="Переключить тему">☀️</button>
        <button type="button" class="icon-button menu-toggle" data-menu-toggle aria-controls="main-nav" aria-expanded="false" aria-label="Открыть меню">☰</button>
      </div>
    </div>
  </header>

  <main id="content">
    <div class="container">

      <header class="page-header fade-in-up">
        <h1>Поиск фильмов</h1>
        <p class="page-subtitle">Ищем по названию и описанию. Описания в датасете на английском — например, «space» или «Batman».</p>
      </header>

      <form class="search-box" role="search" id="search-form" autocomplete="off">
        <label for="search-input" class="visually-hidden">Название или описание фильма</label>
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="search" id="search-input" class="input"
               placeholder="Введите название или слово из описания…"
               aria-describedby="search-info">
      </form>

      <section class="toolbar" aria-label="Фильтры поиска">
        <div class="control">
          <label for="genre-filter">Жанр</label>
          <select id="genre-filter" class="select">
            <option value="">Все жанры</option>
          </select>
        </div>
        <div class="control">
          <label for="sort-select">Сортировка</label>
          <select id="sort-select" class="select">
            <option value="popularity">По популярности</option>
            <option value="rating">По рейтингу</option>
            <option value="date">По дате</option>
          </select>
        </div>
        <div class="control">
          <label for="rating-range">Минимальный рейтинг</label>
          <div class="range-row">
            <input type="range" id="rating-range" min="0" max="10" step="0.5" value="0">
            <output id="rating-value" class="range-value" for="rating-range">0</output>
          </div>
        </div>
        <p class="toolbar-info" id="search-info" aria-live="polite"></p>
      </section>

      <h2 class="visually-hidden">Результаты поиска</h2>
      <div class="movie-grid" id="results" aria-busy="true">
        <!-- Результаты вставляются из js/search.js -->
      </div>

      <div class="load-more">
        <button type="button" class="button button-secondary" id="load-more" hidden>Показать ещё</button>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-current-year></span> MoviePicker</span>
      <span>Данные: датасет Top Movies (TMDB)</span>
    </div>
  </footer>
</body>
</html>
