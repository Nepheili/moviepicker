<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Жанр — MoviePicker</title>
  <meta name="description" content="Топ-20 самых популярных фильмов выбранного жанра.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <script>
    try { var t = localStorage.getItem("moviepicker-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="js/data-loader.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/genre.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" aria-label="MoviePicker — на главную">
        <span class="logo-mark" aria-hidden="true">🎬</span>
        <span>Movie<span class="accent">Picker</span></span>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Основная навигация">
        <ul>
          <li><a href="index.html">Главная</a></li>
          <li><a href="index.html#genres" aria-current="page">Жанры</a></li>
          <li><a href="search.html">Поиск</a></li>
          <li><a href="about.html">О проекте</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="icon-button" data-theme-toggle aria-label="Переключить тему">☀️</button>
        <button type="button" class="icon-button menu-toggle" data-menu-toggle aria-controls="main-nav" aria-expanded="false" aria-label="Открыть меню">☰</button>
      </div>
    </div>
  </header>

  <main id="content">
    <div class="container">

      <header class="page-header fade-in-up">
        <a class="back-link" href="index.html#genres">← Назад к жанрам</a>
        <div class="page-title">
          <span class="genre-emoji" id="genre-emoji" aria-hidden="true">🎞️</span>
          <div>
            <h1 id="genre-title">Загрузка…</h1>
            <p class="page-subtitle" id="genre-subtitle">Топ-20 фильмов в жанре</p>
          </div>
        </div>
      </header>

      <!-- Панель управления -->
      <section class="toolbar" aria-label="Настройки отображения">
        <div class="control">
          <label for="sort-select">Сортировка</label>
          <select id="sort-select" class="select">
            <option value="popularity">По популярности</option>
            <option value="rating">По рейтингу</option>
            <option value="date">По дате</option>
          </select>
        </div>

        <div class="control">
          <label for="rating-range">Минимальный рейтинг</label>
          <div class="range-row">
            <input type="range" id="rating-range" min="0" max="10" step="0.5" value="0"
                   aria-describedby="rating-value">
            <output id="rating-value" class="range-value" for="rating-range">0</output>
          </div>
        </div>

        <div class="control">
          <span class="control-label" id="view-label">Вид</span>
          <div class="view-toggle" role="group" aria-labelledby="view-label">
            <button type="button" data-view="grid" aria-pressed="true">▦ Сетка</button>
            <button type="button" data-view="list" aria-pressed="false">☰ Список</button>
          </div>
        </div>

        <p class="toolbar-info" id="result-info" aria-live="polite"></p>
      </section>

      <h2 class="visually-hidden" id="list-title">Топ-20 фильмов в жанре</h2>
      <div class="movie-grid" id="movie-grid" aria-labelledby="list-title" aria-busy="true">
        <!-- Карточки вставляются из js/genre.js -->
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-current-year></span> MoviePicker</span>
      <span>Данные: датасет Top Movies (TMDB)</span>
    </div>
  </footer>
</body>
</html>
